appId: com.web-access.candidate-tool
productName: BOSS直聘候选人AI评分助手
# 版权信息：写进「程序」和「安装包」的文件属性里（右键 → 属性 → 详细信息 → 版权 / 公司），
# 日常使用界面看不到，只有专门去查才看得到；改了界面文字也抹不掉，要抹得拿源码重新打包。
copyright: "Copyright © 2026 KuroNya39 (https://github.com/KuroNya39)"
# 只打包中英文语言包（省 ~44M），避免带 40+ 种 Chromium 语言
electronLanguages:
  - zh-CN
  - en-US
directories:
  output: build-tmp
# 纯 JS/自带 wasm 依赖，无 .node 原生模块：跳过每次 @electron/rebuild，缩短打包时间
npmRebuild: false
files:
  - electron/**/*
  - scripts/**/*.mjs
  - "!scripts/*.test.mjs"
  - "!scripts/process-icon.mjs"
  - "!scripts/make-ico.mjs"
  - config/scoring-prompt-chat.txt
  - config/scoring-prompt-with-jd.txt
  - "!config/jd-descriptions/**"
  - package.json
  - node_modules/**/*
  - "!node_modules/electron-builder/**"
  - "!node_modules/sharp/**"
  - "!node_modules/png-to-ico/**"
  - "!**/*.map"
  - "!**/*.md"
  - "!LICENSES.chromium.html"
  - build/app_icon_rounded.png
  - ocr-lang/**/*
# 许可协议随程序一起分发（协议要求：向使用者提供协议文本）。落到安装目录根部，
# 用户点进安装目录就能看到 LICENSE.md，不必解包 app.asar
extraFiles:
  - from: LICENSE.md
    to: LICENSE.md
asarUnpack:
  - "scripts/**"
  - "config/scoring-prompt-chat.txt"
  - "config/scoring-prompt-with-jd.txt"
  - "ocr-lang/**"
  - "build/app_icon_rounded.png"
  # 子进程(fork)需要访问实体文件，不能放在 asar 里
  - "node_modules/**"
win:
  signAndEditExecutable: false
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: BOSS直聘候选人AI评分助手
  deleteAppDataOnUninstall: false
  # 给安装程序加 DPI 感知（清单里的 dpiAware）。不挂这个文件，安装界面在非 100% 缩放的屏幕上
  # 会被 Windows 当图片拉伸放大而发糊。内容与代价见 build/installer.nsh 顶部注释
  include: build/installer.nsh
extraMetadata:
  main: electron/main.mjs
