appId: com.web-access.candidate-tool
productName: Boss直聘候选人AI评分助手
# 只打包中英文语言包（省 ~44M），避免带 40+ 种 Chromium 语言
electronLanguages:
  - zh-CN
  - en-US
directories:
  output: build-tmp
files:
  - electron/**/*
  - scripts/**/*.mjs
  - "!scripts/*.test.mjs"
  - "!scripts/process-icon.mjs"
  - "!scripts/make-ico.mjs"
  - config/scoretext.md
  - config/scoring-prompt-chat.txt
  - config/scoring-prompt-with-jd.txt
  - config/filter-rules.json
  - "!config/jd-descriptions/**"
  - package.json
  - node_modules/**/*
  - "!node_modules/electron-builder/**"
  - "!node_modules/sharp/**"
  - "!node_modules/png-to-ico/**"
  - "!**/*.map"
  - "!**/*.md"
  - "!LICENSES.chromium.html"
  - app_icon_rounded.png
  - ocr-lang/**/*
asarUnpack:
  - "scripts/**"
  - "config/scoretext.md"
  - "config/scoring-prompt-chat.txt"
  - "config/scoring-prompt-with-jd.txt"
  - "config/filter-rules.json"
  - "ocr-lang/**"
  - "app_icon_rounded.png"
  # 子进程(fork)需要访问实体文件，不能放在 asar 里
  - "node_modules/**"
win:
  signAndEditExecutable: false
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Boss直聘候选人AI评分助手
  deleteAppDataOnUninstall: false
extraMetadata:
  main: electron/main.mjs
