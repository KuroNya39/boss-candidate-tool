<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>Boss直聘候选人提取分析</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- 标题 -->
    <header>
      <h1>Boss直聘候选人提取分析</h1>
    </header>

    <!-- 初始状态 -->
    <div id="state-initial" class="state active">
      <div class="status-bar" id="chrome-status-bar">
        <span class="status-dot" id="chrome-status-dot"></span>
        <span class="status-text" id="chrome-status-text">正在检查 CDP 代理...</span>
        <button id="btn-retry-chrome" class="btn-retry" style="display:none;">重试</button>
      </div>
      <div class="api-config">
        <div class="api-config-title">API 配置</div>
        <div class="api-field">
          <label for="api-url">API 地址</label>
          <div class="input-wrap">
            <input type="text" id="api-url" placeholder="https://api.xxx.com">
            <span class="input-clear" data-target="api-url">×</span>
          </div>
        </div>
        <div class="api-field">
          <label for="api-key">API Key</label>
          <div class="input-wrap">
            <input type="password" id="api-key" placeholder="sk-...">
            <span class="input-clear" data-target="api-key">×</span>
          </div>
        </div>
        <div class="api-field">
          <label for="api-model">模型名称</label>
          <div class="input-wrap">
            <input type="text" id="api-model" placeholder="claude-sonnet-...">
            <span class="input-clear" data-target="api-model">×</span>
          </div>
        </div>
        <div class="sub-section-title">邮件通知</div>
        <div class="api-field">
          <label for="email-prefix">目标邮箱前缀</label>
          <div class="input-wrap">
            <input type="text" id="email-prefix" placeholder="zhangsan（发到 zhangsan@allwinnertech.com）">
            <span class="input-clear" data-target="email-prefix">×</span>
          </div>
        </div>

        <button id="btn-save-config" class="btn btn-secondary btn-small">保存配置</button>
        <span id="config-status" class="config-status"></span>
      </div>

      <div class="card">
        <div class="card-title">运行配置</div>

        <!-- Source Toggle -->
        <div class="field-group">
          <label class="field-label">提取来源</label>
          <div class="toggle-group" id="source-toggle-group">
            <button class="toggle-btn active" data-source="recommend-attach">推荐牛人页</button>
            <button class="toggle-btn" data-source="chat">沟通页</button>
          </div>
        </div>

        <div id="recommend-hint" class="hint-box" style="display:none;">
          <span class="hint-icon">i</span>
          <span>请先在 Chrome 中打开 Boss 直聘推荐牛人页，并选择岗位、设置筛选条件，不要刷新页面</span>
        </div>
        <div id="chat-hint" class="hint-box" style="display:none;">
          <span class="hint-icon">i</span>
          <span>请先在 Chrome 中打开 Boss 直聘沟通页</span>
        </div>

        <!-- Job selector (recommend only) -->
        <div id="job-select-section" class="field-group" style="display:none;">
          <label class="field-label">目标岗位</label>
          <div class="job-selector">
            <span id="job-display" class="job-display placeholder">请选择岗位</span>
          </div>
        </div>

        <!-- Count -->
        <div class="field-group">
          <label class="field-label">提取数量</label>
          <div class="count-controls">
            <input type="number" id="count-input" class="input-number" value="20" min="1" max="999">
            <span class="count-unit">人</span>
            <label class="checkbox-label">
              <input type="checkbox" id="extract-all" checked>
              <span>提取全部</span>
            </label>
          </div>
        </div>

        <!-- Divider -->
        <div class="card-divider"></div>

        <!-- Auto Greet -->
        <div class="auto-greet-section">
          <label class="checkbox-label">
            <input type="checkbox" id="auto-greet-check">
            <span>分析完成后自动打招呼</span>
          </label>
          <div class="auto-greet-controls" id="auto-greet-controls" style="display:none;">
            <select id="auto-greet-level" class="input-select">
              <option value="5">五星（91-100分）</option>
              <option value="4" selected>四星及以上（81-90分）</option>
              <option value="3">三星及以上（61-80分）</option>
              <option value="2">二星及以上（31-60分）</option>
              <option value="0">全部候选人</option>
            </select>
          </div>
        </div>

        <!-- Start button -->
        <button id="btn-start" class="btn-primary btn-start">
          ▶ 开始提取分析
        </button>
      </div>
    </div>

    <!-- 执行中状态 -->
    <div id="state-running" class="state">
      <div class="steps-container">
        <div class="step-card" id="step-1">
          <div class="step-header">
            <span class="step-icon">1</span>
            <span class="step-title">提取候选人信息</span>
            <span class="step-status" id="step-1-status">等待中</span>
          </div>
          <div class="progress-bar-container">
            <div class="progress-bar" id="step-1-bar"></div>
          </div>
          <div class="step-message" id="step-1-msg"></div>
        </div>
        <div class="step-card" id="step-2">
          <div class="step-header">
            <span class="step-icon">2</span>
            <span class="step-title">AI 评分</span>
            <span class="step-status" id="step-2-status">等待中</span>
          </div>
          <div class="progress-bar-container">
            <div class="progress-bar" id="step-2-bar"></div>
          </div>
          <div class="step-message" id="step-2-msg"></div>
        </div>
        <div class="step-card" id="step-3">
          <div class="step-header">
            <span class="step-icon">3</span>
            <span class="step-title">导出 Excel</span>
            <span class="step-status" id="step-3-status">等待中</span>
          </div>
          <div class="progress-bar-container">
            <div class="progress-bar" id="step-3-bar"></div>
          </div>
          <div class="step-message" id="step-3-msg"></div>
        </div>
      </div>
      <div class="running-actions">
        <button id="btn-skip-extract" class="btn btn-warning" style="display:none;">⏭ 跳过提取简历，直接 AI 评分</button>
        <button id="btn-cancel" class="btn btn-secondary">取消</button>
      </div>
    </div>

    <!-- 完成状态 -->
    <div id="state-done" class="state">
      <div class="result-icon result-success">&#10003;</div>
      <h2>任务执行完成！</h2>
      <div class="result-summary" id="done-summary"></div>
      <div class="result-actions">
        <button id="btn-open-dir" class="btn btn-primary">&#128194; 打开输出目录</button>
        <button id="btn-restart" class="btn btn-secondary">重新开始</button>
      </div>

      <!-- 批量打招呼（评分完成后显示） -->
      <div id="greet-section" class="greet-section" style="display:none;">
        <div class="greet-divider"></div>
        <div class="greet-title">批量打招呼</div>
        <div class="greet-controls">
          <label class="greet-label">选择等级：</label>
          <select id="greet-level" class="greet-select">
            <option value="5">五星（91-100分）</option>
            <option value="4" selected>四星及以上（81-90分）</option>
            <option value="3">三星及以上（61-80分）</option>
            <option value="2">二星及以上（31-60分）</option>
            <option value="0">全部候选人</option>
          </select>
          <span id="greet-count" class="greet-count"></span>
        </div>
        <div class="greet-actions">
          <button id="btn-start-greet" class="btn btn-primary btn-small">开始打招呼</button>
          <button id="btn-cancel-greet" class="btn btn-secondary btn-small" style="display:none;">取消</button>
        </div>
        <div id="greet-progress" class="greet-progress" style="display:none;">
          <div class="greet-progress-bar-container">
            <div class="greet-progress-bar" id="greet-progress-bar"></div>
          </div>
          <div class="greet-progress-text" id="greet-progress-text"></div>
        </div>
        <div id="greet-result" class="greet-result" style="display:none;"></div>
      </div>
    </div>

    <!-- 错误状态 -->
    <div id="state-error" class="state">
      <div class="result-icon result-error">&#10007;</div>
      <h2>执行出错</h2>
      <div class="error-message" id="error-message"></div>
      <button id="btn-retry" class="btn btn-primary">重试</button>
    </div>
  </div>

  <!-- 添加岗位弹窗 -->
  <div id="job-dialog-overlay" class="dialog-overlay" style="display:none;">
    <div class="dialog-box">
      <div class="dialog-title">添加新岗位</div>
      <div class="dialog-field">
        <label for="dialog-job-name">岗位名称</label>
        <input type="text" id="dialog-job-name" placeholder="例如：AI大模型工程师 _ 深圳 30-50K">
        <div id="dialog-job-hint" class="dialog-hint">含 / 的字符（如 Soc/泛平板）程序会自动处理，直接填写即可</div>
      </div>
      <div class="dialog-field">
        <label for="dialog-job-desc">岗位描述</label>
        <textarea id="dialog-job-desc" rows="8" placeholder="请粘贴该岗位的 JD 描述..."></textarea>
      </div>
      <div class="dialog-actions">
        <button id="btn-dialog-save" class="btn btn-primary">保存</button>
        <button id="btn-dialog-cancel" class="btn btn-secondary">取消</button>
      </div>
    </div>
  </div>

  <!-- 目标岗位弹窗 -->
  <div id="job-picker-overlay" class="dialog-overlay" style="display:none;">
    <div class="dialog-box">
      <div class="dialog-title">目标岗位</div>
      <div class="job-picker-list" id="job-picker-list"></div>
      <div class="dialog-actions">
        <button id="btn-picker-cancel" class="btn btn-secondary">取消</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
