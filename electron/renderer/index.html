<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>BOSS直聘候选人AI评分助手</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 图标库（Material outlined 同套）：字形统一为 outline 空心，在此一处定义，各处用 <use href="#..."> 引用；
       icon-play（开始）与 icon-skip（跳过）两个 CTA 动作键按强调需要做实心（fill=1），为全站仅有的实心功能图标 -->

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="icon-settings" viewBox="0 0 24 24"><path fill="currentColor" d="M19.43 12.98c.04-.32.07-.64.07-.98 0-.34-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65A.488.488 0 0 0 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1a.566.566 0 0 0-.18-.03c-.17 0-.34.09-.43.25l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98 0 .33.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46a.5.5 0 0 0 .61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.06.02.12.03.18.03.17 0 .34-.09.43-.25l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zm-1.98-1.71c.04.31.05.52.05.73 0 .21-.02.43-.05.73l-.14 1.13.89.7 1.08.84-.7 1.21-1.27-.51-1.04-.42-.9.68c-.43.32-.84.56-1.25.73l-1.06.43-.16 1.13-.2 1.35h-1.4l-.19-1.35-.16-1.13-1.06-.43c-.43-.18-.83-.41-1.23-.71l-.91-.7-1.06.43-1.27.51-.7-1.21 1.08-.84.89-.7-.14-1.13c-.03-.31-.05-.54-.05-.74s.02-.43.05-.73l.14-1.13-.89-.7-1.08-.84.7-1.21 1.27.51 1.04.42.9-.68c.43-.32.84-.56 1.25-.73l1.06-.43.16-1.13.2-1.35h1.39l.19 1.35.16 1.13 1.06.43c.43.18.83.41 1.23.71l.91.7 1.06-.43 1.27-.51.7 1.21-1.07.85-.89.7.14 1.13zM12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm0 6c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></symbol>
      <symbol id="icon-eye-on" viewBox="0 0 24 24"><path fill="currentColor" d="M12 6a9.77 9.77 0 0 1 8.82 5.5C19.17 14.87 15.79 17 12 17s-7.17-2.13-8.82-5.5A9.77 9.77 0 0 1 12 6m0-2C7 4 2.73 7.11 1 11.5 2.73 15.89 7 19 12 19s9.27-3.11 11-7.5C21.27 7.11 17 4 12 4zm0 5a2.5 2.5 0 0 1 0 5 2.5 2.5 0 0 1 0-5m0-2c-2.48 0-4.5 2.02-4.5 4.5S9.52 16 12 16s4.5-2.02 4.5-4.5S14.48 7 12 7z"/></symbol>
      <symbol id="icon-eye-off" viewBox="0 0 24 24"><path fill="currentColor" d="M12 6a9.77 9.77 0 0 1 8.82 5.5 9.647 9.647 0 0 1-2.41 3.12l1.41 1.41c1.39-1.23 2.49-2.77 3.18-4.53C21.27 7.11 17 4 12 4c-1.27 0-2.49.2-3.64.57l1.65 1.65C10.66 6.09 11.32 6 12 6zm-1.07 1.14L13 9.21c.57.25 1.03.71 1.28 1.28l2.07 2.07c.08-.34.14-.7.14-1.07C16.5 9.01 14.48 7 12 7c-.37 0-.72.05-1.07.14zM2.01 3.87l2.68 2.68A11.738 11.738 0 0 0 1 11.5C2.73 15.89 7 19 12 19c1.52 0 2.98-.29 4.32-.82l3.42 3.42 1.41-1.41L3.42 2.45 2.01 3.87zm7.5 7.5 2.61 2.61c-.04.01-.08.02-.12.02a2.5 2.5 0 0 1-2.5-2.5c0-.05.01-.08.01-.13zm-3.4-3.4 1.75 1.75a4.6 4.6 0 0 0-.36 1.78 4.507 4.507 0 0 0 6.27 4.14l.98.98c-.88.24-1.8.38-2.75.38a9.77 9.77 0 0 1-8.82-5.5c.7-1.43 1.72-2.61 2.93-3.53z"/></symbol>
      <symbol id="icon-info" viewBox="0 0 24 24"><path fill="currentColor" d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></symbol>
      <symbol id="icon-check" viewBox="0 0 24 24"><path fill="currentColor" d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></symbol>
      <symbol id="icon-close" viewBox="0 0 24 24"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></symbol>
      <symbol id="icon-play" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"/></symbol>
      <symbol id="icon-pause" viewBox="0 0 24 24"><path fill="currentColor" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></symbol>
      <symbol id="icon-skip" viewBox="0 0 24 24"><path fill="currentColor" d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></symbol>
      <symbol id="icon-folder" viewBox="0 0 24 24"><path fill="currentColor" d="m9.17 6 2 2H20v10H4V6h5.17M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></symbol>
      <symbol id="icon-refresh" viewBox="0 0 24 24"><path fill="currentColor" d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></symbol>
      <symbol id="icon-chevron-right" viewBox="0 0 24 24"><path fill="currentColor" d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></symbol>
      <symbol id="icon-chevron-down" viewBox="0 0 24 24"><path fill="currentColor" d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></symbol>
      <!-- icon-resize：右下角抓握标（岗位描述输入框可拖拽调高）。两线 45° 严格平行；
           短线为长线右下方的缩短回声，两线中点落在同一公垂线上（居中对齐），主次清晰、不抢眼 -->
      <symbol id="icon-resize" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M7 19L18 8M13 19L18 14"/></symbol>
    </defs>
  </svg>
  <div id="app">
    <!-- 标题 -->
    <header>
      <h1>BOSS直聘候选人AI评分助手<span id="app-version" class="app-version"></span></h1>
    </header>

    <!-- 初始状态 -->
    <div id="state-initial" class="state active">
      <div class="status-bar" id="chrome-status-bar">
        <span class="status-dot" id="chrome-status-dot"></span>
        <span class="status-text" id="chrome-status-text">正在检查 CDP 代理…</span>
        <button id="btn-retry-chrome" class="btn btn--ghost btn--sm btn--retry" style="display:none;">重试</button>
      </div>
      <div class="card collapsible-card" id="api-config-card">
        <div class="collapsible-topbar">
          <button type="button" class="collapsible-header" id="api-config-toggle" aria-expanded="false" aria-controls="api-config-body">
            <span class="collapsible-header-left">
              <span class="collapsible-icon" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24"><use href="#icon-settings"/></svg></span>
              <span class="collapsible-title">设置</span>
            </span>
            <svg class="collapsible-arrow" id="api-config-arrow" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-chevron-right"/></svg>
          </button>
        </div>
        <div class="collapsible-body" id="api-config-body">
          <div class="field-group">
            <label class="field-label" for="api-url">API 地址（Anthropic 格式）</label>
            <input type="text" id="api-url" class="input-text" placeholder="https://api.example.com">
          </div>
          <div class="field-group">
            <label class="field-label" for="api-key">API Key</label>
            <div class="input-wrap">
              <input type="password" id="api-key" class="input-text" placeholder="sk-...">
              <button type="button" class="field-icon-btn input-toggle" data-target="api-key" aria-label="显示 API Key" aria-pressed="false">
                <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-eye-off"/></svg>
              </button>
            </div>
          </div>
          <div class="field-group">
            <label class="field-label" for="api-model">模型名称</label>
            <input type="text" id="api-model" class="input-text" placeholder="gpt5.6-…">
          </div>
          <div class="field-group">
            <label class="field-label" for="email-prefix">邮件通知（可选）</label>
            <input type="text" id="email-prefix" class="input-text" placeholder="zhangsan@example.com">
          </div>
          <div class="field-group">
            <label class="field-label" for="smtp-pass">邮箱密码</label>
            <div class="input-wrap">
              <input type="password" id="smtp-pass" class="input-text" placeholder="邮箱登录密码，或三方客户端安全密码">
              <button type="button" class="field-icon-btn input-toggle" data-target="smtp-pass" aria-label="显示邮箱密码" aria-pressed="false">
                <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-eye-off"/></svg>
              </button>
            </div>
          </div>
          <div class="output-row">
            <span class="output-label">输出目录：</span>
            <span class="output-dir-field">
              <span id="output-dir" class="output-path">output/</span>
              <button id="btn-select-dir" class="field-icon-btn output-dir-btn" aria-label="更改输出目录">
                <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-folder"/></svg>
              </button>
            </span>
            <button id="btn-history" class="btn btn--secondary btn--sm">历史记录</button>
          </div>
          <div class="collapsible-actions">
            <button id="btn-save-config" class="btn btn--secondary">保存设置</button>
          </div>
        </div>
      </div>

      <div class="card" id="run-config-card">
        <div class="card-title run-config-title" tabindex="-1">运行配置</div>

        <!-- 来源分段选择：三个按钮文字本身就是来源名，无需再配「提取来源」标题 -->
        <div class="toggle-group" id="source-toggle-group">
          <button class="toggle-btn active" data-source="recommend-attach">推荐牛人页</button>
          <button class="toggle-btn" data-source="search">搜索页</button>
          <button class="toggle-btn" data-source="chat">沟通页</button>
        </div>

        <!-- 目标岗位 + 提取数量：两列并排，一屏更紧凑 -->
        <div class="run-grid" id="run-grid-main">
          <div id="job-select-section" class="field-group" style="display:none;">
            <label class="field-label" id="job-select-label">目标岗位</label>
            <div class="job-selector">
              <button type="button" id="job-display" class="job-display placeholder">请选择岗位</button>
            </div>
          </div>
          <div class="field-group">
            <label class="field-label" for="count-input">提取数量</label>
            <div class="count-controls">
              <input type="number" id="count-input" class="input-number" value="20" min="1" max="999">
              <span class="count-unit">人</span>
              <span id="extract-all-section">
                <label class="checkbox-label">
                  <input type="checkbox" id="extract-all" checked>
                  <span>提取全部</span>
                </label>
              </span>
            </div>
          </div>
        </div>

        <!-- 模拟复制 + 自动打招呼：同级次要选项，并排到同一行 -->
        <div class="config-opts-row">
          <div class="copy-opt-group">
            <label class="checkbox-label">
              <input type="checkbox" id="enable-copy">
              <span>开启模拟复制提取</span>
            </label>
            <button type="button" class="tip-icon" data-tip="建议在电脑闲置时开启，提取更快更准" aria-label="建议在电脑闲置时开启，提取更快更准"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-info"/></svg></button>
          </div>
          <div class="auto-greet-section" id="auto-greet-section">
            <label class="checkbox-label">
              <input type="checkbox" id="auto-greet-check">
              <span>完成后自动打招呼</span>
            </label>
            <div class="auto-greet-controls" id="auto-greet-controls" style="display:none;">
              <div class="custom-select" id="auto-greet-level" data-value="4">
                <button type="button" class="custom-select-trigger" aria-haspopup="listbox" aria-expanded="false">
                  <span class="custom-select-label">四星及以上（81 分以上）</span>
                  <svg class="custom-select-arrow" width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-chevron-down"/></svg>
                </button>
                <div class="custom-select-menu" role="listbox" style="display:none;">
                  <button type="button" class="custom-select-option" data-value="5" role="option" aria-selected="false">五星（91 分以上）</button>
                  <button type="button" class="custom-select-option" data-value="4" role="option" aria-selected="true">四星及以上（81 分以上）</button>
                  <button type="button" class="custom-select-option" data-value="3" role="option" aria-selected="false">三星及以上（61 分以上）</button>
                  <button type="button" class="custom-select-option" data-value="2" role="option" aria-selected="false">二星及以上（31 分以上）</button>
                  <button type="button" class="custom-select-option" data-value="0" role="option" aria-selected="false">全部候选人</button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Start button -->
        <button id="btn-start" class="btn btn--primary btn--lg btn--block">
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-play"/></svg>开始提取分析
        </button>
        <p id="btn-start-hint" class="field-hint" aria-live="polite"></p>
      </div>
    </div>

    <!-- 执行中状态 -->
    <div id="state-running" class="state">
      <div class="card">
        <div class="card-title" tabindex="-1">
          执行进度
          <span id="step-indicator" class="step-indicator" aria-live="polite">等待开始</span>
        </div>

        <div class="step-item" id="step-1">
          <div class="step-item-header">
            <div class="step-item-left">
              <span class="step-number">1</span>
              <span class="step-item-title">提取候选人信息</span>
            </div>
            <span class="step-item-status" id="step-1-status">等待中</span>
          </div>
          <div class="step-progress">
            <div class="progress-track">
              <div class="progress-fill" id="step-1-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
            </div>
            <span class="progress-pct" id="step-1-pct"></span>
          </div>
          <div class="step-msg" id="step-1-msg" aria-live="polite"></div>
        </div>

        <div class="step-item" id="step-2">
          <div class="step-item-header">
            <div class="step-item-left">
              <span class="step-number">2</span>
              <span class="step-item-title">AI 评分</span>
            </div>
            <span class="step-item-status" id="step-2-status">等待中</span>
          </div>
          <div class="step-progress">
            <div class="progress-track">
              <div class="progress-fill" id="step-2-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
            </div>
            <span class="progress-pct" id="step-2-pct"></span>
          </div>
          <div class="step-msg" id="step-2-msg" aria-live="polite"></div>
        </div>

        <div class="step-item" id="step-3">
          <div class="step-item-header">
            <div class="step-item-left">
              <span class="step-number">3</span>
              <span class="step-item-title">导出 Excel</span>
            </div>
            <span class="step-item-status" id="step-3-status">等待中</span>
          </div>
          <div class="step-progress">
            <div class="progress-track">
              <div class="progress-fill" id="step-3-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
            </div>
            <span class="progress-pct" id="step-3-pct"></span>
          </div>
          <div class="step-msg" id="step-3-msg" aria-live="polite"></div>
        </div>

        <div class="running-actions">
          <button id="btn-skip-extract" class="btn btn--warning" style="display:none;"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-skip"/></svg>跳过提取</button>
          <button id="btn-pause-extract" class="btn btn--ghost" style="display:none;"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-pause"/></svg>暂停</button>
          <button id="btn-cancel" class="btn btn--ghost">取消</button>
        </div>
      </div>
    </div>

    <!-- 完成状态 -->
    <div id="state-done" class="state">
      <div class="card">
        <div class="result-header">
          <div class="result-icon-circle success" aria-hidden="true">
            <span class="result-icon-check"><svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-check"/></svg></span>
          </div>
          <div class="result-title" tabindex="-1">全部完成！</div>
        </div>
        <div class="result-summary" id="done-summary"></div>
        <details id="mail-error-details" class="mail-error-details" style="display:none;">
          <summary>邮件发送失败的原因</summary>
          <div id="mail-error-detail" class="mail-error-detail"></div>
        </details>
        <div class="result-actions">
          <button id="btn-open-dir" class="btn btn--primary"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-folder"/></svg>打开输出目录</button>
          <button id="btn-restart" class="btn btn--ghost"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-refresh"/></svg>重新开始</button>
        </div>

        <!-- 完成页结果可视化：统计条 + 档位分布 + 可展开的候选人列表 -->
        <div id="results-visual" class="results-visual" style="display:none;">
          <div class="results-title">评分结果一览</div>

          <div class="results-stats">
            <div class="stat-cell">
              <span class="stat-value" id="stat-extracted">0</span>
              <span class="stat-label">提取人数</span>
            </div>
            <div class="stat-cell">
              <span class="stat-value" id="stat-passed">0</span>
              <span class="stat-label">通过人数</span>
            </div>
            <div class="stat-cell">
              <span class="stat-value" id="stat-avg">0</span>
              <span class="stat-label">平均分</span>
            </div>
            <div class="stat-cell">
              <span class="stat-value" id="stat-rate">0%</span>
              <span class="stat-label">通过率</span>
            </div>
          </div>

          <div class="tier-bars" id="tier-bars" aria-label="档位分布"></div>

          <div class="results-candidates">
            <div class="results-candidates-head">
              <span>候选人</span>
              <span id="results-count" class="results-count"></span>
            </div>
            <div class="results-list" id="results-list" role="list"></div>
          </div>
        </div>

        <div id="greet-section" class="greet-section" style="display:none;">
          <div class="greet-title-row">
            <span class="greet-title">批量打招呼</span>
            <span id="greet-count" class="greet-count-text"></span>
          </div>
          <div class="greet-controls">
            <div class="custom-select" id="greet-level" data-value="4">
              <button type="button" class="custom-select-trigger" aria-haspopup="listbox" aria-expanded="false">
                <span class="custom-select-label">四星及以上（81 分以上）</span>
                <svg class="custom-select-arrow" width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-chevron-down"/></svg>
              </button>
              <div class="custom-select-menu" role="listbox" style="display:none;">
                <button type="button" class="custom-select-option" data-value="5" role="option" aria-selected="false">五星（91 分以上）</button>
                <button type="button" class="custom-select-option" data-value="4" role="option" aria-selected="true">四星及以上（81 分以上）</button>
                <button type="button" class="custom-select-option" data-value="3" role="option" aria-selected="false">三星及以上（61 分以上）</button>
                <button type="button" class="custom-select-option" data-value="2" role="option" aria-selected="false">二星及以上（31 分以上）</button>
                <button type="button" class="custom-select-option" data-value="0" role="option" aria-selected="false">全部候选人</button>
              </div>
            </div>
            <button id="btn-start-greet" class="btn btn--primary greet-start">开始打招呼</button>
            <button id="btn-cancel-greet" class="btn btn--ghost greet-start" style="display:none;">取消</button>
          </div>
          <div id="greet-progress" class="greet-progress" style="display:none;">
            <div class="progress-track">
              <div class="progress-fill" id="greet-progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
            </div>
            <div class="greet-progress-text" id="greet-progress-text"></div>
          </div>
          <div id="greet-result" class="greet-result" style="display:none;" aria-live="polite"></div>
        </div>

      </div>
    </div>

    <!-- 错误状态 -->
    <div id="state-error" class="state">
      <div class="card">
        <div class="result-header">
          <div class="result-icon-circle error" aria-hidden="true">
            <span class="result-icon-check"><svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-close"/></svg></span>
          </div>
          <div class="result-title" tabindex="-1">执行出错</div>
        </div>
        <div class="error-message" id="error-message" role="alert"></div>
        <div class="result-actions">
          <button id="btn-retry" class="btn btn--primary">重试</button>
          <button id="btn-error-back" class="btn btn--ghost">返回</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 添加岗位弹窗 -->
  <div id="job-dialog-overlay" class="dialog-overlay" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="job-dialog-title">
    <div class="dialog-box">
      <div class="dialog-title" id="job-dialog-title">添加新岗位</div>
      <div class="dialog-field">
        <label for="dialog-job-name">岗位名称</label>
        <input type="text" id="dialog-job-name" placeholder="例如：AI大模型工程师 _ 深圳 30-50K">
      </div>
      <div class="dialog-field">
        <label for="dialog-job-desc">岗位描述</label>
        <textarea id="dialog-job-desc" rows="8" placeholder="粘贴已按 README 第5步转换好的岗位描述（勿粘贴原始 JD）"></textarea>
        <div class="textarea-resize-handle" id="dialog-resize-handle" aria-hidden="true">
          <svg class="icon" width="14" height="14" viewBox="0 0 24 24"><use href="#icon-resize"/></svg>
        </div>
      </div>
      <div class="dialog-actions">
        <button id="btn-dialog-cancel" class="btn btn--ghost">取消</button>
        <button id="btn-dialog-save" class="btn btn--primary">保存</button>
      </div>
    </div>
  </div>

  <!-- 目标岗位弹窗 -->
  <div id="job-picker-overlay" class="dialog-overlay" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="job-picker-title">
    <div class="dialog-box">
      <div class="dialog-title" id="job-picker-title">目标岗位</div>
      <div class="job-picker-search">
        <input type="text" id="job-search-input" class="job-picker-search-input" placeholder="搜索岗位…" autocomplete="off" />
        <button type="button" id="job-search-clear" class="input-clear" aria-label="清空搜索">
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-close"/></svg>
        </button>
      </div>
      <div class="job-picker-list" id="job-picker-list" role="list" aria-live="polite"></div>
      <div class="dialog-actions">
        <button id="btn-picker-cancel" class="btn btn--ghost">取消</button>
      </div>
    </div>
  </div>

  <!-- 历史记录抽屉（左侧滑出） -->
  <div id="history-overlay" class="history-overlay" style="display:none;">
    <div class="history-drawer" id="history-drawer" role="dialog" aria-modal="true" aria-labelledby="history-title" tabindex="-1">
      <div class="dialog-title" id="history-title">历史记录</div>
      <div class="history-list" id="history-list" role="list"></div>
      <div class="history-empty" id="history-empty" style="display:none;">暂无历史记录。</div>
      <div class="history-footer">
        <button id="btn-history-clear-all" class="btn btn--link btn--link-danger">清空历史记录</button>
      </div>
    </div>
  </div>

  <!-- 通用确认弹窗（替代原生 confirm/alert） -->
  <div id="confirm-overlay" class="dialog-overlay" style="display:none;">
    <div class="dialog-box confirm-box" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-message">
      <div class="dialog-title" id="confirm-title"></div>
      <div class="confirm-message" id="confirm-message"></div>
      <div class="dialog-actions">
        <button id="btn-confirm-cancel" class="btn btn--ghost">取消</button>
        <button id="btn-confirm-ok" class="btn btn--primary">确定</button>
      </div>
    </div>
  </div>

  <!-- Toast 容器 -->
  <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>

  <!-- 渲染层脚本已拆分：10 个文件共享全局作用域，加载顺序即下方排列顺序，切勿调整 -->
  <script src="renderer-dom.js"></script>
  <script src="renderer-widgets.js"></script>
  <script src="renderer-progress.js"></script>
  <script src="renderer-results.js"></script>
  <script src="renderer-ipc.js"></script>
  <script src="renderer-actions.js"></script>
  <script src="renderer-history.js"></script>
  <script src="renderer-jobs.js"></script>
  <script src="renderer-dialogs.js"></script>
  <script src="renderer-greet.js"></script>
</body>
</html>
