<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>BOSS直聘候选人AI评分助手</title>
  <!-- 样式已拆分：6 个 CSS 按原 style.css 内部顺序排列，级联结果与拆前逐像素一致，切勿调换顺序。
       tokens(设计 token) → base(重置/滚动条/#app) → topbar → config → run → overlays(弹窗/结果/历史记录) -->
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="topbar.css">
  <link rel="stylesheet" href="config.css">
  <link rel="stylesheet" href="run.css">
  <link rel="stylesheet" href="overlays.css">
</head>
<body spellcheck="false">
  <!-- 图标库（Material Symbols & Icons，当前版）。
       每个 symbol 的 viewBox 是官方原样保留的 0 -960 960 960，路径数据直接来自 Google 的
       material-design-icons/symbols/web/<name>/materialsymbolsoutlined/，**不要手改路径**——
       <use> 会把 symbol 自己的坐标系缩放到宿主 svg 的视口，所以调用处仍写 width/height="16"
       这种像素值、外框 viewBox="0 0 24 24"，与旧版 24 格路径在几何上等价，不必按 960 换算尺寸。
       字形统一为 outline 空心；icon-skip / icon-play / icon-pause 三个动作键按强调需要做实心，
       取的是同一目录下的 *_fill1_24px.svg（Material Symbols 的 fill 轴），为全站仅有的实心功能图标。
       换图标 = 换墨迹占比：新路径的实心范围与旧版不同，凡是「按墨迹对齐」定过尺寸的地方
       （历史记录行的删除/文件夹，见 docs/design-system.md §7「墨迹微调」）要重新实测 getBBox 再定尺寸 -->

      <symbol id="icon-eye-on" viewBox="0 -960 960 960"><path fill="currentColor" d="M480-320q75 0 127.5-52.5T660-500q0-75-52.5-127.5T480-680q-75 0-127.5 52.5T300-500q0 75 52.5 127.5T480-320Zm0-72q-45 0-76.5-31.5T372-500q0-45 31.5-76.5T480-608q45 0 76.5 31.5T588-500q0 45-31.5 76.5T480-392Zm0 192q-146 0-266-81.5T40-500q54-137 174-218.5T480-800q146 0 266 81.5T920-500q-54 137-174 218.5T480-200Zm0-300Zm0 220q113 0 207.5-59.5T832-500q-50-101-144.5-160.5T480-720q-113 0-207.5 59.5T128-500q50 101 144.5 160.5T480-280Z"/></symbol>
      <symbol id="icon-eye-off" viewBox="0 -960 960 960"><path fill="currentColor" d="m644-428-58-58q9-47-27-88t-93-32l-58-58q17-8 34.5-12t37.5-4q75 0 127.5 52.5T660-500q0 20-4 37.5T644-428Zm128 126-58-56q38-29 67.5-63.5T832-500q-50-101-143.5-160.5T480-720q-29 0-57 4t-55 12l-62-62q41-17 84-25.5t90-8.5q151 0 269 83.5T920-500q-23 59-60.5 109.5T772-302Zm20 246L624-222q-35 11-70.5 16.5T480-200q-151 0-269-83.5T40-500q21-53 53-98.5t73-81.5L56-792l56-56 736 736-56 56ZM222-624q-29 26-53 57t-41 67q50 101 143.5 160.5T480-280q20 0 39-2.5t39-5.5l-36-38q-11 3-21 4.5t-21 1.5q-75 0-127.5-52.5T300-500q0-11 1.5-21t4.5-21l-84-82Zm319 93Zm-151 75Z"/></symbol>
      <symbol id="icon-info" viewBox="0 -960 960 960"><path fill="currentColor" d="M440-280h80v-240h-80v240Zm40-320q17 0 28.5-11.5T520-640q0-17-11.5-28.5T480-680q-17 0-28.5 11.5T440-640q0 17 11.5 28.5T480-600Zm0 520q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"/></symbol>
      <symbol id="icon-check" viewBox="0 -960 960 960"><path fill="currentColor" d="M382-240 154-468l57-57 171 171 367-367 57 57-424 424Z"/></symbol>
      <symbol id="icon-close" viewBox="0 -960 960 960"><path fill="currentColor" d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></symbol>
      <symbol id="icon-play" viewBox="0 -960 960 960"><path fill="currentColor" d="M320-200v-560l440 280-440 280Z"/></symbol>
      <symbol id="icon-pause" viewBox="0 -960 960 960"><path fill="currentColor" d="M560-200v-560h160v560H560Zm-320 0v-560h160v560H240Z"/></symbol>

      <symbol id="icon-folder" viewBox="0 -960 960 960"><path fill="currentColor" d="M160-160q-33 0-56.5-23.5T80-240v-480q0-33 23.5-56.5T160-800h240l80 80h320q33 0 56.5 23.5T880-640v400q0 33-23.5 56.5T800-160H160Zm0-80h640v-400H447l-80-80H160v480Zm0 0v-480 480Z"/></symbol>
      <symbol id="icon-delete" viewBox="0 -960 960 960"><path fill="currentColor" d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520ZM360-280h80v-360h-80v360Zm160 0h80v-360h-80v360ZM280-720v520-520Z"/></symbol>
      <symbol id="icon-refresh" viewBox="0 -960 960 960"><path fill="currentColor" d="M480-160q-134 0-227-93t-93-227q0-134 93-227t227-93q69 0 132 28.5T720-690v-110h80v280H520v-80h168q-32-56-87.5-88T480-720q-100 0-170 70t-70 170q0 100 70 170t170 70q77 0 139-44t87-116h84q-28 106-114 173t-196 67Z"/></symbol>
      <symbol id="icon-chevron-right" viewBox="0 -960 960 960"><path fill="currentColor" d="M504-480 320-664l56-56 240 240-240 240-56-56 184-184Z"/></symbol>
      <symbol id="icon-chevron-down" viewBox="0 -960 960 960"><path fill="currentColor" d="M480-344 240-584l56-56 184 184 184-184 56 56-240 240Z"/></symbol>
      <symbol id="icon-chevron-up" viewBox="0 -960 960 960"><path fill="currentColor" d="M480-528 296-344l-56-56 240-240 240 240-56 56-184-184Z"/></symbol>
      <!-- icon-arrow-drop-down：气泡尖角用（见 config.css 的 .tip-arrow）。字形墨迹 10×5、两条腰 45°，
           调用处放大 1.2 倍包进 28.8 的盒子露出 12×6 的尖角 —— 倍数与那个 28.8 的理由见 docs/design-system.md §7 -->
      <symbol id="icon-arrow-drop-down" viewBox="0 -960 960 960"><path fill="currentColor" d="M480-360 280-560h400L480-360Z"/></symbol>
      <!-- 顶栏菜单按钮（more_vert：竖三点）与菜单项图标 -->
      <symbol id="icon-more-vert" viewBox="0 -960 960 960"><path fill="currentColor" d="M480-160q-33 0-56.5-23.5T400-240q0-33 23.5-56.5T480-320q33 0 56.5 23.5T560-240q0 33-23.5 56.5T480-160Zm0-240q-33 0-56.5-23.5T400-480q0-33 23.5-56.5T480-560q33 0 56.5 23.5T560-480q0 33-23.5 56.5T480-400Zm0-240q-33 0-56.5-23.5T400-720q0-33 23.5-56.5T480-800q33 0 56.5 23.5T560-720q0 33-23.5 56.5T480-640Z"/></symbol>
      <symbol id="icon-history" viewBox="0 -960 960 960"><path fill="currentColor" d="M480-120q-138 0-240.5-91.5T122-440h82q14 104 92.5 172T480-200q117 0 198.5-81.5T760-480q0-117-81.5-198.5T480-760q-69 0-129 32t-101 88h110v80H120v-240h80v94q51-64 124.5-99T480-840q75 0 140.5 28.5t114 77q48.5 48.5 77 114T840-480q0 75-28.5 140.5t-77 114q-48.5 48.5-114 77T480-120Zm112-192L440-464v-216h80v184l128 128-56 56Z"/></symbol>
      <!-- icon-resize：右下角抓握标（岗位描述输入框可拖拽调高）。两线 45° 严格平行；
           短线是长线右下方的缩短回声、中点落在长线的公垂线上（相对居中）。几何：长线 (7,19)→(18,8)、
           短线 (14.5,19.5)→(18.5,15.5)——两线中心距 ≈2.8px（紧贴但扫一眼仍能分清是两条线）。改它时保持此几何 -->
      <symbol id="icon-resize" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M7 19L18 8M14.5 19.5L18.5 15.5"/></symbol>
    </defs>
  </svg>
  <div id="app">
    <!-- 标题：软件名居中、版本号放最右不参与居中（topbar.css 三列 grid 布局）。
         左上角 ⋮ 是「设置 / 历史记录」的唯一入口，两项都在它的下拉里（原来设置是首页折叠卡） -->
    <header>
      <div class="menu-wrap">
        <button type="button" id="btn-menu" class="menu-btn" aria-haspopup="menu" aria-expanded="false" aria-label="菜单">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-more-vert"/></svg>
        </button>
        <div class="menu-panel" id="menu-panel" role="menu" style="display:none;">
          <button type="button" class="menu-item" id="btn-open-settings" role="menuitem">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-settings"/></svg><span>设置</span>
          </button>
          <button type="button" class="menu-item" id="btn-history" role="menuitem">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-history"/></svg><span>历史记录</span>
          </button>
        </div>
      </div>
      <h1>BOSS直聘候选人AI评分助手</h1>
      <span id="app-version" class="app-version"></span>
    </header>

    <!-- 初始状态 -->
    <div id="state-initial" class="state active">
      <div class="status-bar" id="chrome-status-bar">
        <span class="status-dot" id="chrome-status-dot"></span>
        <span class="status-text" id="chrome-status-text">正在检查 CDP 代理…</span>
        <button id="btn-retry-chrome" class="btn btn--ghost btn--sm btn--retry" style="display:none;">重试</button>
      </div>
      <div class="card" id="run-config-card">
        <!-- 来源分段选择：三个按钮文字本身就是来源名，无需再配「提取来源」标题 -->
        <div class="toggle-group" id="source-toggle-group">
          <button class="toggle-btn active" data-source="recommend-attach">推荐牛人页</button>
          <button class="toggle-btn" data-source="search">搜索页</button>
          <button class="toggle-btn" data-source="chat">沟通页</button>
          <!-- 滑动指示条：放在按钮之后，悬停选中按钮时可借兄弟选择器加深它；JS 负责落位，pointer-events none 不挡点击 -->
          <span class="toggle-pill" aria-hidden="true"></span>
        </div>

        <!-- 目标岗位 + 提取数量：两列并排，一屏更紧凑 -->
        <div class="run-grid" id="run-grid-main">
          <div id="job-select-section" class="field-group" style="display:none;">
            <label class="field-label" id="job-select-label">目标岗位</label>
            <div class="job-selector">
              <button type="button" id="job-display" class="job-display placeholder" aria-haspopup="dialog">请选择岗位</button>
            </div>
          </div>
          <div class="field-group">
            <label class="field-label" for="count-input">提取数量</label>
            <div class="count-controls">
              <!-- 提取数量：原生 spin 已隐藏（config.css），步进用 sprite 图标自绘并浮在数字框右侧。
                   平时隐藏、悬停框上或聚焦才淡入（同 Chrome 原生箭头的交互手感），无分隔线、不占布局 -->
              <span class="count-field">
                <input type="number" id="count-input" class="input-number" value="20" min="1" max="999" aria-label="提取数量">
                <span class="count-arrows">
                  <button type="button" id="count-inc" class="count-arrow" aria-label="数量加一">
                    <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-chevron-up"/></svg>
                  </button>
                  <button type="button" id="count-dec" class="count-arrow" aria-label="数量减一">
                    <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-chevron-down"/></svg>
                  </button>
                </span>
              </span>
              <span class="count-unit">人</span>
              <span id="extract-all-section">
                <label class="checkbox-label">
                  <input type="checkbox" id="extract-all" checked>
                  <span>提取全部</span>
                </label>
              </span>
            </div>
          </div>
        </div>

        <!-- 模拟复制 + 自动打招呼：同级次要选项，并排到同一行 -->
        <div class="config-opts-row">
          <div class="copy-opt-group">
            <label class="checkbox-label">
              <input type="checkbox" id="enable-copy">
              <span>开启模拟复制提取</span>
            </label>
            <button type="button" class="tip-icon" data-tip="建议在电脑闲置时开启，提取更快更准" aria-label="建议在电脑闲置时开启，提取更快更准"><svg class="tip-arrow" width="28.8" height="28.8" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-arrow-drop-down"/></svg><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-info"/></svg></button>
          </div>
          <div class="auto-greet-section" id="auto-greet-section">
            <label class="checkbox-label">
              <input type="checkbox" id="auto-greet-check">
              <span>完成后自动打招呼</span>
            </label>
            <div class="auto-greet-controls" id="auto-greet-controls" style="display:none;">
              <div class="custom-select" id="auto-greet-level" data-value="4">
                <button type="button" class="custom-select-trigger" aria-haspopup="listbox" aria-expanded="false">
                  <span class="custom-select-label">四星及以上（81 分以上）</span>
                  <svg class="custom-select-arrow" width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-chevron-down"/></svg>
                </button>
                <div class="custom-select-menu" role="listbox" style="display:none;">
                  <button type="button" class="custom-select-option" data-value="5" role="option" aria-selected="false">五星（91 分以上）</button>
                  <button type="button" class="custom-select-option" data-value="4" role="option" aria-selected="true">四星及以上（81 分以上）</button>
                  <button type="button" class="custom-select-option" data-value="3" role="option" aria-selected="false">三星及以上（61 分以上）</button>
                  <button type="button" class="custom-select-option" data-value="2" role="option" aria-selected="false">二星及以上（31 分以上）</button>
                  <button type="button" class="custom-select-option" data-value="0" role="option" aria-selected="false">全部候选人</button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Start button：设置没填全时按钮置灰（updateConfigStatus），按钮下方不加说明文字 -->
        <button id="btn-start" class="btn btn--cta btn--block">开始提取分析</button>
      </div>
    </div>

    <!-- 执行中状态 -->
    <div id="state-running" class="state">
      <div class="card">
        <div class="card-title" tabindex="-1">
          执行进度
          <span id="step-indicator" class="step-indicator" aria-live="polite">等待开始</span>
        </div>

        <div class="step-item" id="step-1">
          <div class="step-item-header">
            <div class="step-item-left">
              <span class="step-number">1</span>
              <span class="step-item-title">提取候选人信息</span>
            </div>
            <span class="step-item-status" id="step-1-status">等待中</span>
          </div>
          <div class="step-progress">
            <div class="progress-track">
              <div class="progress-fill" id="step-1-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
            </div>
            <span class="progress-pct" id="step-1-pct"></span>
          </div>
          <div class="step-msg" id="step-1-msg" aria-live="polite"></div>
        </div>

        <div class="step-item" id="step-2">
          <div class="step-item-header">
            <div class="step-item-left">
              <span class="step-number">2</span>
              <span class="step-item-title">AI 评分</span>
            </div>
            <span class="step-item-status" id="step-2-status">等待中</span>
          </div>
          <div class="step-progress">
            <div class="progress-track">
              <div class="progress-fill" id="step-2-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
            </div>
            <span class="progress-pct" id="step-2-pct"></span>
          </div>
          <div class="step-msg" id="step-2-msg" aria-live="polite"></div>
        </div>

        <div class="step-item" id="step-3">
          <div class="step-item-header">
            <div class="step-item-left">
              <span class="step-number">3</span>
              <span class="step-item-title">导出 Excel</span>
            </div>
            <span class="step-item-status" id="step-3-status">等待中</span>
          </div>
          <div class="step-progress">
            <div class="progress-track">
              <div class="progress-fill" id="step-3-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
            </div>
            <span class="progress-pct" id="step-3-pct"></span>
          </div>
          <div class="step-msg" id="step-3-msg" aria-live="polite"></div>
        </div>

        <div class="running-actions">
          <button id="btn-skip-extract" class="btn btn--warning" style="display:none;"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-skip"/></svg>跳过提取</button>
          <button id="btn-pause-extract" class="btn btn--ghost" style="display:none;"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-pause"/></svg>暂停</button>
          <button id="btn-cancel" class="btn btn--ghost">取消</button>
        </div>
      </div>
    </div>

    <!-- 完成状态 -->
    <div id="state-done" class="state">
      <div class="card">
        <div class="result-header">
          <div class="result-icon-circle success" aria-hidden="true">
            <span class="result-icon-check"><svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-check"/></svg></span>
          </div>
          <div class="result-title" tabindex="-1">全部完成！</div>
        </div>
        <div class="result-summary" id="done-summary"></div>
        <details id="mail-error-details" class="mail-error-details" style="display:none;">
          <summary><svg class="mail-error-arrow" width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-chevron-right"/></svg>邮件发送失败的原因</summary>
          <div id="mail-error-detail" class="mail-error-detail"></div>
        </details>
        <div class="result-actions">
          <button id="btn-open-dir" class="btn btn--primary"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-folder"/></svg>打开输出目录</button>
          <button id="btn-restart" class="btn btn--ghost"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-refresh"/></svg>重新开始</button>
        </div>

        <!-- 完成页结果可视化：统计条 + 档位分布 + 可展开的候选人列表 -->
        <div id="results-visual" class="results-visual" style="display:none;">
          <div class="results-title">评分结果一览</div>

          <div class="results-stats">
            <div class="stat-cell">
              <span class="stat-value" id="stat-extracted">0</span>
              <span class="stat-label">提取人数</span>
            </div>
            <div class="stat-cell">
              <span class="stat-value" id="stat-passed">0</span>
              <span class="stat-label">通过人数</span>
            </div>
            <div class="stat-cell">
              <span class="stat-value" id="stat-avg">0</span>
              <span class="stat-label">平均分</span>
            </div>
            <div class="stat-cell">
              <span class="stat-value" id="stat-rate">0%</span>
              <span class="stat-label">通过率</span>
            </div>
          </div>

          <!-- role=group 让 aria-label 生效（裸 div 上的 aria-label 会被读屏忽略）；
               不用 role=img：那样整块被当成一张图，右列「N 人 · P%」的文字就读不到了 -->
          <div class="tier-bars" id="tier-bars" role="group" aria-label="档位分布"></div>

          <div class="results-candidates">
            <div class="results-candidates-head">
              <span>候选人</span>
              <span id="results-count" class="results-count"></span>
            </div>
            <div class="results-list" id="results-list" role="list"></div>
          </div>
        </div>

        <div id="greet-section" class="greet-section" style="display:none;">
          <div class="greet-title-row">
            <span class="greet-title">批量打招呼</span>
            <span id="greet-count" class="greet-count-text"></span>
          </div>
          <div class="greet-controls">
            <div class="custom-select" id="greet-level" data-value="4">
              <button type="button" class="custom-select-trigger" aria-haspopup="listbox" aria-expanded="false">
                <span class="custom-select-label">四星及以上（81 分以上）</span>
                <svg class="custom-select-arrow" width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-chevron-down"/></svg>
              </button>
              <div class="custom-select-menu" role="listbox" style="display:none;">
                <button type="button" class="custom-select-option" data-value="5" role="option" aria-selected="false">五星（91 分以上）</button>
                <button type="button" class="custom-select-option" data-value="4" role="option" aria-selected="true">四星及以上（81 分以上）</button>
                <button type="button" class="custom-select-option" data-value="3" role="option" aria-selected="false">三星及以上（61 分以上）</button>
                <button type="button" class="custom-select-option" data-value="2" role="option" aria-selected="false">二星及以上（31 分以上）</button>
                <button type="button" class="custom-select-option" data-value="0" role="option" aria-selected="false">全部候选人</button>
              </div>
            </div>
            <button id="btn-start-greet" class="btn btn--primary greet-start">开始打招呼</button>
            <button id="btn-cancel-greet" class="btn btn--ghost greet-start" style="display:none;">取消</button>
          </div>
          <div id="greet-progress" class="greet-progress" style="display:none;">
            <div class="progress-track">
              <div class="progress-fill" id="greet-progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
            </div>
            <!-- aria-live：进度文字是这一屏唯一的「跑起来了没有」信号，加之前读屏用户全程听不到任何反馈。
                 与下面的 #greet-result 同一档（polite），也和进度条的 role="progressbar" 分工明确：
                 条给程序化取值，这行字负责播报。不加 aria-atomic —— 只想让它报变化的那截「3/20」，
                 每来一个人把整句「正在打招呼… 3/20」念一遍太吵 -->
            <div class="greet-progress-text" id="greet-progress-text" aria-live="polite"></div>
          </div>
          <div id="greet-result" class="greet-result" style="display:none;" aria-live="polite"></div>
        </div>

      </div>
    </div>

    <!-- 错误状态 -->
    <div id="state-error" class="state">
      <div class="card">
        <div class="result-header">
          <div class="result-icon-circle error" aria-hidden="true">
            <span class="result-icon-check"><svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-close"/></svg></span>
          </div>
          <div class="result-title" tabindex="-1">执行出错</div>
        </div>
        <div class="error-message" id="error-message" role="alert"></div>
        <div class="result-actions">
          <button id="btn-retry" class="btn btn--primary">重试</button>
          <button id="btn-error-back" class="btn btn--ghost">返回</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 添加岗位弹窗 -->
  <div id="job-dialog-overlay" class="dialog-overlay" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="job-dialog-title">
    <div class="dialog-box">
      <div class="dialog-title" id="job-dialog-title">添加新岗位</div>
      <div class="dialog-field">
        <label for="dialog-job-name">岗位名称</label>
        <input type="text" id="dialog-job-name">
      </div>
      <div class="dialog-field">
        <label for="dialog-job-desc">岗位描述</label>
        <textarea id="dialog-job-desc" rows="8" spellcheck="false" placeholder="粘贴转换后的岗位描述，请勿直接粘贴原始岗位 JD"></textarea>
        <div class="textarea-resize-handle" id="dialog-resize-handle" aria-hidden="true">
          <svg class="icon" width="12" height="12" viewBox="0 0 24 24"><use href="#icon-resize"/></svg>
        </div>
      </div>
      <div class="dialog-actions">
        <button id="btn-dialog-cancel" class="btn btn--ghost">取消</button>
        <button id="btn-dialog-save" class="btn btn--primary">保存</button>
      </div>
    </div>
  </div>

  <!-- 目标岗位弹窗 -->
  <div id="job-picker-overlay" class="dialog-overlay" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="job-picker-title">
    <div class="dialog-box">
      <div class="dialog-title" id="job-picker-title">目标岗位</div>
      <div class="job-picker-search">
        <input type="text" id="job-search-input" class="job-picker-search-input" placeholder="搜索岗位或拼音首字母…" aria-label="搜索岗位或拼音首字母" autocomplete="off" />
        <button type="button" id="job-search-clear" class="field-icon-btn input-clear" aria-label="清空搜索">
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-close"/></svg>
        </button>
      </div>
      <div class="job-picker-list" id="job-picker-list" role="list" aria-live="polite"></div>
      <div class="dialog-actions">
        <button id="btn-picker-cancel" class="btn btn--ghost">取消</button>
      </div>
    </div>
  </div>

  <!-- 设置弹窗：原首页折叠卡的内容整块搬进来，字段 id 一个没改（renderer-ipc.js 的读写逻辑照旧） -->
  <div id="settings-overlay" class="dialog-overlay" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="dialog-box settings-box">
      <div class="dialog-title" id="settings-title">设置</div>
      <!-- 窗口矮时只有表单区滚动，标题与底部按钮固定不动 -->
      <div class="settings-body">
        <div class="field-group">
          <label class="field-label" for="api-url">API 地址（Anthropic 格式）</label>
          <input type="text" id="api-url" class="input-text" placeholder="https://api.example.com">
        </div>
        <div class="field-group">
          <label class="field-label" for="api-key">API Key</label>
          <div class="input-wrap">
            <input type="password" id="api-key" class="input-text" placeholder="sk-...">
            <button type="button" class="field-icon-btn input-toggle" data-target="api-key" aria-label="显示 API Key" aria-pressed="false">
              <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-eye-off"/></svg>
            </button>
          </div>
        </div>
        <div class="field-group">
          <label class="field-label" for="api-model">模型名称</label>
          <input type="text" id="api-model" class="input-text" placeholder="gpt-5.6-…">
        </div>
        <div class="field-group">
          <label class="field-label" for="email-prefix">邮箱地址（可选）</label>
          <input type="text" id="email-prefix" class="input-text" placeholder="zhangsan@example.com">
        </div>
        <div class="field-group">
          <label class="field-label" for="smtp-pass">邮箱密码</label>
          <div class="input-wrap">
            <input type="password" id="smtp-pass" class="input-text" placeholder="邮箱登录密码，或三方客户端安全密码">
            <button type="button" class="field-icon-btn input-toggle" data-target="smtp-pass" aria-label="显示邮箱密码" aria-pressed="false">
              <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-eye-off"/></svg>
            </button>
          </div>
        </div>
        <div class="output-row">
          <span class="output-label">输出目录：</span>
          <span class="output-dir-field">
            <span id="output-dir" class="output-path">output/</span>
            <button id="btn-select-dir" class="field-icon-btn output-dir-btn" aria-label="更改输出目录">
              <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-folder"/></svg>
            </button>
          </span>
        </div>
      </div>
      <div class="dialog-actions">
        <button id="btn-settings-close" class="btn btn--ghost">关闭</button>
        <button id="btn-save-config" class="btn btn--primary">保存</button>
      </div>
    </div>
  </div>

  <!-- 历史记录弹窗（与设置同一套居中弹窗；原来是左侧滑出的抽屉） -->
  <div id="history-overlay" class="dialog-overlay" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="history-title">
    <div class="dialog-box history-box" id="history-drawer" tabindex="-1">
      <div class="dialog-title" id="history-title">历史记录</div>
      <div class="history-list" id="history-list" role="list"></div>
      <div class="history-empty" id="history-empty" style="display:none;">暂无历史记录。</div>
      <div class="history-footer">
        <button id="btn-history-clear-all" class="btn btn--link btn--danger-ghost">清空历史记录</button>
      </div>
    </div>
  </div>

  <!-- 通用确认弹窗（替代原生 confirm/alert） -->
  <div id="confirm-overlay" class="dialog-overlay" style="display:none;">
    <div class="dialog-box confirm-box" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-message">
      <div class="dialog-title" id="confirm-title"></div>
      <div class="confirm-message" id="confirm-message"></div>
      <div class="dialog-actions">
        <button id="btn-confirm-cancel" class="btn btn--ghost">取消</button>
        <button id="btn-confirm-ok" class="btn btn--primary">确定</button>
      </div>
    </div>
  </div>

  <!-- Toast 容器：本身不做 live region，改由每条 toast 自己带 role（错误=alert、其余=status）。
       容器若也标 role=status，就成了「live region 套 live region」，读屏会把同一条提示念两遍。
       注意 showToast 是先插入空节点、下一帧才填文字（读屏只在既有 live region 内容变化时播报） -->
  <div id="toast-container" class="toast-container"></div>

  <!-- 渲染层脚本已拆分：10 个文件共享全局作用域，加载顺序即下方排列顺序，切勿调整 -->
  <script src="renderer-dom.js"></script>
  <script src="renderer-widgets.js"></script>
  <script src="renderer-progress.js"></script>
  <script src="renderer-results.js"></script>
  <script src="renderer-ipc.js"></script>
  <script src="renderer-actions.js"></script>
  <script src="renderer-history.js"></script>
  <script src="renderer-jobs.js"></script>
  <script src="renderer-dialogs.js"></script>
  <script src="renderer-greet.js"></script>
</body>
</html>
